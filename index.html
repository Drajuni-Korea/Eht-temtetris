<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>EHT 템트리스 v4</title>
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--card:#1e222b;--line:#303644;--text:#f5f7fb;--muted:#aab2c0;--acc:#8ec5ff;--good:#7ddc9b;--warn:#ffd166;--bad:#ff8b8b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:980px;margin:auto;padding:14px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.title{font-size:22px;font-weight:800}.sub{font-size:13px;color:var(--muted)}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--bg);padding:8px 0 12px}.tabs button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-weight:700}.tabs button.active{background:#253249;border-color:#45648d}
.panel{display:none}.panel.active{display:block}.box{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px}.box h3{margin:0 0 10px;font-size:16px}.grid{display:grid;gap:10px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
label span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}select,input,button{font:inherit}select,input[type=number],input[type=text]{width:100%;min-height:44px;background:#11151c;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:16px}
.btn{min-height:46px;border:0;border-radius:12px;padding:10px 14px;background:#2d6cdf;color:white;font-weight:800}.btn.sec{background:#252a34;border:1px solid var(--line)}.btn.danger{background:#7b2d2d}.btn:disabled{opacity:.5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;color:var(--muted)}
.preview{width:100%;max-height:520px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#090b0f}.status{font-size:13px;color:var(--muted);line-height:1.6}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.item{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin-top:8px}.itemhead{display:flex;justify-content:space-between;gap:8px}.opts{font-size:13px;color:var(--muted);line-height:1.7;margin-top:6px}.mini{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px}.big{font-size:22px;font-weight:800;margin-top:3px}.footerbar{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.96);border-top:1px solid var(--line);padding:10px}.footerbar .inner{max-width:980px;margin:auto;display:flex;gap:8px}.footerbar button{flex:1}
@media(max-width:700px){.g3,.g4{grid-template-columns:1fr 1fr}.app{padding-left:10px;padding-right:10px}.title{font-size:20px}.tabs button{font-size:13px}.hide-mobile{display:none}}
@media(max-width:430px){.g2,.g3,.g4{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="app">
<div class="top"><div><div class="title">EHT 템트리스</div><div class="sub">서버 OCR · 앱 전환 후에도 처리 · IndexedDB 영구저장 · 역할별 계산</div></div><span class="pill">v4</span></div>
<div class="tabs">
<button data-tab="scan" class="active">캡처등록</button><button data-tab="inv">보유장비</button><button data-tab="calc">계산</button><button data-tab="best">최적조합</button>
</div>

<section id="scan" class="panel active">
<div class="box"><h3>스크린샷 자동 등록</h3><input id="imgInput" type="file" accept="image/*" multiple /><div style="height:8px"></div><img id="preview" class="preview" alt="업로드 미리보기" style="display:none"><div id="ocrStatus" class="status" style="margin-top:8px">캡처를 선택하면 파란색 일반 옵션 위주로 OCR을 시도합니다. 빨간 디메리트와 분홍 옵션은 무시합니다.</div></div>
<div class="box"><h3>인식 결과 확인</h3><div class="grid g3">
<label><span>부위</span><select id="scanSlot"></select></label><label><span>단계</span><select id="scanTier"><option value="origin">태초</option><option value="chaos">혼돈</option><option value="abyss" selected>심연</option></select></label><label><span>특수/유니크</span><select id="scanSpecial"></select></label>
</div><div class="grid g4" style="margin-top:10px"><label><span>옵션1</span><select id="so1"></select></label><label><span>옵션2</span><select id="so2"></select></label><label><span>옵션3</span><select id="so3"></select></label><label><span>옵션4</span><select id="so4"></select></label></div>
<div class="row" style="margin-top:10px"><button id="registerBtn" class="btn">등록</button><button id="clearScan" class="btn sec">초기화</button></div></div>
</section>

<section id="inv" class="panel"><div class="box"><div class="row" style="justify-content:space-between"><div><h3 style="margin-bottom:2px">보유 장비</h3><div id="invCount" class="mini">0개</div><div id="dbStatus" class="mini good">DB 준비 중…</div></div><div class="row"><button id="exportBtn" class="btn sec">백업</button><label class="btn sec" style="display:inline-flex;align-items:center;cursor:pointer">복원<input id="importInput" type="file" accept="application/json" style="display:none"></label><button id="wipeBtn" class="btn danger">전체삭제</button></div></div><div id="inventory"></div></div></section>

<section id="calc" class="panel">
<div class="box"><h3>역할/장비 단계</h3><div class="grid g2"><label><span>역할</span><select id="role"><option value="pvpDps">PvP 딜러</option><option value="pvpTank">PvP 탱커</option><option value="wbDps">월드보스 딜러</option></select></label><label><span>옵션 단계</span><select id="tier"><option value="origin">태초</option><option value="chaos">혼돈</option><option value="abyss" selected>심연</option></select></label></div><div id="roleDesc" class="status" style="margin-top:8px"></div></div>
<div class="box"><h3>룬/고정 수치</h3><div class="grid g4"><label><span>치확%</span><input id="rCrit" type="number" value="0"></label><label><span>회피%</span><input id="rEva" type="number" value="0"></label><label><span>뎀감</span><input id="rDmg" type="number" value="0"></label><label><span>흡혈%</span><input id="rLeech" type="number" value="0"></label></div></div>
<div class="box"><h3>공격속도 0.25</h3><div class="grid g4"><label><span>직업</span><select id="job"><option value="berserker">버서커</option><option value="sorcerer">소서러</option><option value="ranger">레인저</option><option value="paladin">팔라딘</option></select></label><label><span>무기</span><select id="weaponType"><option value="field">필드</option><option value="special" selected>콜로/월보</option></select></label><label><span>스탯 공속</span><select id="statGrade"><option value="0">흰 0%</option><option value="10">파랑 10%</option><option value="20">주황 20%</option><option value="30" selected>보라 30%</option></select></label><label><span>성격</span><select id="personality"><option value="0">기타</option><option value="7">영웅심리 7%</option><option value="10">날쌘돌이 10%</option></select></label></div>
<div class="grid g4" style="margin-top:10px"><label><span>비법</span><select id="secret"></select></label><label><span>룬 공속%</span><input id="rSpeed" type="number" value="0"></label><label><span>퀴큰</span><select id="quicken"><option value="1">Lv0</option><option value="1.1">Lv1</option><option value="1.2">Lv2</option><option value="1.3">Lv3</option><option value="1.4">Lv4</option><option value="1.5">Lv5</option></select></label><label><span>퓨리</span><select id="fury"></select></label></div>
<div class="row" style="margin-top:10px"><label class="row"><input id="union" type="checkbox" checked> 연합 5%</label><label class="row"><input id="pet" type="checkbox" checked> 펫장비 12%</label></div><div id="speedResult" class="status" style="margin-top:8px"></div></div>
<div class="box"><h3>필요 옵션</h3><div id="needCards" class="cards"></div></div>
</section>

<section id="best" class="panel"><div class="box"><div class="row" style="justify-content:space-between"><div><h3 style="margin-bottom:2px">8부위 최적 조합</h3><div class="mini">현재 계산 탭의 역할/필요 옵션을 사용합니다.</div></div><button id="optBtn" class="btn">최적 조합 찾기</button></div><div id="bestStatus" class="status" style="margin-top:10px"></div><div id="bestSet"></div></div></section>
</div>
<div class="footerbar"><div class="inner"><button class="btn sec" id="goScan">캡처등록</button><button class="btn" id="goBest">최적조합</button></div></div>
<script>
(()=>{
const $=id=>document.getElementById(id); const tabs=[...document.querySelectorAll('[data-tab]')];
function showTab(id){tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));scrollTo({top:0,behavior:'smooth'})}
tabs.forEach(b=>b.onclick=()=>showTab(b.dataset.tab)); $('goScan').onclick=()=>showTab('scan'); $('goBest').onclick=()=>showTab('best');
const common=[['atkspd','공격속도'],['crit','치명타 확률'],['eva','회피'],['exp','경험치'],['dmgred','데미지 감소'],['leech','흡혈'],['gold','골드'],['material','재료'],['movespd','이동속도'],['hunger','허기'],['mood','기분'],['stamina','기력'],['atk','공격력'],['def','방어력'],['hp','체력'],['boss','보스류 데미지'],['human','영장류 데미지'],['undead','언데드 데미지'],['demon','악마류 데미지'],['animal','동물류 데미지'],['critdmg','치명타 데미지']];
const weaponOnly=[['angel','대천사'],['devil','대악마'],['dodge','닷지'],['stun','스턴'],['barrier','배리어'],['curse','커즈'],['recover','회복'],['adddmg','추뎀']]; const names=Object.fromEntries([...common,...weaponOnly]);
const slots=[['weapon','무기'],['necklace','목걸이'],['ring','반지'],['helmet','투구'],['belt','벨트'],['gloves','장갑'],['boots','신발'],['armor','갑옷']];const slotNames=Object.fromEntries(slots); const tierNames={origin:'태초',chaos:'혼돈',abyss:'심연'};
const specialBySlot={weapon:[['field','필드무기'],['colo','콜로무기'],['world','월드보스무기'],['devilWeapon','대악마무기']],helmet:[['normal','일반'],['juggernaut','저거너트 헬름'],['blueHelm','콜로 블루 투구']],gloves:[['normal','일반'],['blood','블러드 피스트'],['trueBlood','진 블러드피스트']],boots:[['normal','일반'],['gale','질풍의 경갑'],['trueGale','진 질풍의 경갑']],necklace:[['normal','일반'],['hades','하데스의 목걸이'],['trueHades','진 하데스의 목걸이'],['guard','경비대장의 목걸이'],['dragon','용의 가호 목걸이']],ring:[['normal','일반'],['cyclone','싸이클론 링'],['trueCyclone','진 싸이클론 링'],['trinity','트리니티 링'],['sacrifice','수호자의 희생 반지']],belt:[['normal','일반'],['thunder','뇌룡의 허리띠'],['trueThunder','진 뇌룡의 허리띠'],['alchemy','연금술사의 벨트']],armor:[['normal','일반'],['frost','서리거인의 흉갑'],['trueFrost','진 서리거인의 흉갑'],['absorb','흡수의 갑옷'],['masochist','피학자의 갑옷']]};
const fixedSpecial={gale:['movespd'],trueGale:['movespd'],juggernaut:['hp']};
const roles={pvpDps:{core:['human','critdmg','atk'],supports:['atkspd','crit','eva','leech'],weapon:['colo'],desc:'영장류+치피+공격 3코어를 최대한 유지'},pvpTank:{core:['hp','def'],supports:['dmgred','atkspd','eva','crit'],weapon:['colo'],desc:'체력+방어 2코어 고정'},wbDps:{core:['boss','critdmg','atk'],supports:['atkspd','crit','eva','leech'],weapon:['world','devilWeapon'],desc:'보스+치피+공격 3코어를 최대한 유지'}};
const tiers={origin:{a:12,b:17},chaos:{a:14,b:19},abyss:{a:16,b:21}};const base={berserker:{field:2.0,special:2.2},sorcerer:{field:2.2,special:2.3},ranger:{field:1.8,special:2.0},paladin:{field:2.4,special:2.5}};const furyVals=[1,2.38,2.56,2.74,2.92,3.10,3.28,3.46,3.64,3.82,4,4.18,4.36,4.54,4.72,4.90,5.08];
for(let i=0;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent=`Lv.${i} · ${i}%`;$('secret').append(o)} $('secret').value='10';furyVals.forEach((v,i)=>{const o=document.createElement('option');o.value=v;o.textContent=`Lv.${i}${i>10?' · 룬':''}`;$('fury').append(o)});
function fill(sel,data){sel.innerHTML=data.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')} fill($('scanSlot'),slots);
function refreshSpecial(){fill($('scanSpecial'),specialBySlot[$('scanSlot').value]||[['normal','일반']]);refreshOpts()} $('scanSlot').onchange=refreshSpecial;
function refreshOpts(){const pool=$('scanSlot').value==='weapon'?[...common,...weaponOnly]:common;['so1','so2','so3','so4'].forEach(id=>fill($(id),[['','선택'],...pool]))} refreshSpecial();
let inventory=[];let nextId=1;let db=null;
const DB_NAME='ehtTemtetrisDB',DB_VER=1,STORE='items';
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VER);req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE)){const st=d.createObjectStore(STORE,{keyPath:'id'});st.createIndex('slot','slot',{unique:false});st.createIndex('tier','tier',{unique:false});}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function dbGetAll(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});}
function dbPut(item){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(item);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
function dbDelete(id){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
function dbClear(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}
async function initDB(){try{db=await openDB();inventory=await dbGetAll();inventory.sort((a,b)=>(a.id||0)-(b.id||0));nextId=Math.max(0,...inventory.map(x=>x.id||0))+1;$('dbStatus').textContent='이 기기에 영구 저장 중';$('dbStatus').className='mini good';renderInv();}catch(e){$('dbStatus').textContent='DB 열기 실패 · 이 브라우저에서는 저장 불가';$('dbStatus').className='mini bad';console.error(e);}}
async function saveItem(item){await dbPut(item);const i=inventory.findIndex(x=>x.id===item.id);if(i>=0)inventory[i]=item;else inventory.push(item);inventory.sort((a,b)=>a.id-b.id);renderInv()}

function renderInv(){$('invCount').textContent=`총 ${inventory.length}개`; $('inventory').innerHTML=inventory.length?inventory.map(x=>{const specialLabel=(specialBySlot[x.slot]||[]).find(a=>a[0]===x.special)?.[1]||x.special;const detail=x.equipmentName||specialLabel;return `<div class="item"><div class="itemhead"><div><b>#${x.id} ${tierNames[x.tier]} ${slotNames[x.slot]}</b><div class="mini">${detail}</div></div><button class="btn sec" data-del="${x.id}">삭제</button></div><div class="opts">${x.opts.map(o=>names[o]||o).join(' / ')}</div></div>`}).join(''):'<div class="status">등록된 장비가 없습니다.</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const id=+b.dataset.del;await dbDelete(id);inventory=inventory.filter(x=>x.id!==id);renderInv()})}
$('registerBtn').onclick=async()=>{const opts=['so1','so2','so3','so4'].map(id=>$(id).value).filter(Boolean);const fx=fixedSpecial[$('scanSpecial').value]||[];const merged=[...new Set([...fx,...opts])].slice(0,4);if(merged.length<4){alert('옵션 4개를 확인해 주세요. 고정옵션이 있는 유니크는 고정옵션이 자동 포함됩니다.');return}const item={id:nextId++,slot:$('scanSlot').value,tier:$('scanTier').value,special:$('scanSpecial').value,opts:merged,createdAt:new Date().toISOString()};await saveItem(item);$('ocrStatus').innerHTML='<span class="good">등록 완료 · DB에 저장됨</span>';};
$('clearScan').onclick=()=>{['so1','so2','so3','so4'].forEach(id=>$(id).value='');$('ocrStatus').textContent='초기화했습니다.'};
$('wipeBtn').onclick=async()=>{if(confirm('보유 장비를 모두 삭제할까요?')){await dbClear();inventory=[];nextId=1;renderInv()}};$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(inventory,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eht_inventory.json';a.click();URL.revokeObjectURL(a.href)};$('importInput').onchange=async e=>{try{const txt=await e.target.files[0].text();const arr=JSON.parse(txt);if(Array.isArray(arr)){await dbClear();inventory=[];for(const item of arr){if(item&&Number.isFinite(Number(item.id))){item.id=Number(item.id);await dbPut(item);inventory.push(item);}}inventory.sort((a,b)=>a.id-b.id);nextId=Math.max(0,...inventory.map(x=>x.id||0))+1;renderInv();$('dbStatus').textContent='복원 완료 · '+inventory.length+'개 저장됨';}}catch{alert('복원 파일을 읽지 못했습니다.')}};
function normalizeOCR(s){return s.replace(/\s+/g,' ').replace(/[|]/g,' ')}
const patterns=[['atkspd',/공격\s*속도/],['critdmg',/치명타\s*피해량|치명타\s*피해/],['crit',/치명타\s*확률/],['eva',/회피/],['dmgred',/데미지.*감소|받는.*데미지.*감소/],['leech',/흡혈/],['movespd',/이동\s*속도/],['atk',/전체\s*공격력|공격력/],['def',/전체\s*방어력|방어력/],['hp',/체력/],['boss',/보스류/],['human',/영장류/],['undead',/언데드/],['demon',/악마류/],['animal',/동물류/],['exp',/경험치/],['gold',/골드/],['material',/재료/],['hunger',/허기/],['mood',/기분/],['stamina',/기력/]];
async function runOCR(file){$('ocrStatus').textContent='OCR 분석 중...';const url=URL.createObjectURL(file);$('preview').src=url;$('preview').style.display='block';try{const r=await Tesseract.recognize(file,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent=`OCR ${(m.progress*100|0)}%`}});const txt=normalizeOCR(r.data.text);let found=[];patterns.forEach(([k,re])=>{if(re.test(txt)&&!found.includes(k))found.push(k)});if(/심연/.test(txt))$('scanTier').value='abyss';else if(/혼돈/.test(txt))$('scanTier').value='chaos';else if(/태초/.test(txt))$('scanTier').value='origin';const slotMap=[['gloves',/장갑류|장갑/],['boots',/신발류|경갑|부츠/],['helmet',/투구류|투구|헬름|모자/],['armor',/갑옷류|갑옷|흉갑/],['belt',/벨트류|벨트|허리띠/],['ring',/반지류|링/],['necklace',/목걸이류|목걸이/],['weapon',/무기류|검|활|지팡이|도끼/]];for(const [s,re] of slotMap){if(re.test(txt)){$('scanSlot').value=s;refreshSpecial();break}}
const blueish=found.slice(0,4);['so1','so2','so3','so4'].forEach((id,i)=>{if(blueish[i]&&[...$(id).options].some(o=>o.value===blueish[i]))$(id).value=blueish[i]});$('ocrStatus').innerHTML=`인식 완료: <span class="good">${found.map(x=>names[x]).join(', ')||'옵션 미검출'}</span><br>색상 필터는 휴리스틱이라 등록 전에 4옵션을 확인해 주세요.`}catch(err){$('ocrStatus').innerHTML=`<span class="bad">OCR 실패</span> · 수동 선택으로 등록할 수 있습니다.`}}

let serverFailedScans=[];let manualServerFailId=null;
const JOB_KEY='ehtActiveOcrJob';
function ensureServerUI(){
  if(!$('serverStatus')){
    const d=document.createElement('div');d.id='serverStatus';d.className='status';d.style.marginTop='8px';
    d.textContent='서버 연결 확인 중…';$('ocrStatus').insertAdjacentElement('afterend',d);
  }
  if(!$('serverFailedBox')){
    const box=document.createElement('div');box.id='serverFailedBox';box.className='box';box.style.display='none';
    box.innerHTML='<div class="row" style="justify-content:space-between"><div><h3 style="margin-bottom:2px">확인 필요</h3><div class="mini">자동 등록되지 않은 장비만 표시합니다.</div></div><span id="serverFailedCount" class="pill">0개</span></div><div id="serverFailedList" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px"></div>';
    document.querySelector('#scan .box')?.insertAdjacentElement('afterend',box);
  }
}
function setServerManualForm(d){
  if(d.slot){$('scanSlot').value=d.slot;refreshSpecial()}
  if(d.tier)$('scanTier').value=d.tier;
  if(d.special&&[...$('scanSpecial').options].some(o=>o.value===d.special))$('scanSpecial').value=d.special;
  const vals=(d.opts||[]).slice(0,4);['so1','so2','so3','so4'].forEach((id,i)=>{if(vals[i]&&[...$(id).options].some(o=>o.value===vals[i]))$(id).value=vals[i];else $(id).value=''});
}
function renderServerFailed(){
  ensureServerUI();
  $('serverFailedCount').textContent=serverFailedScans.length+'개';
  $('serverFailedBox').style.display=serverFailedScans.length?'block':'none';
  $('serverFailedList').innerHTML=serverFailedScans.map(f=>{
    const opts=(f.data?.opts||[]).map(x=>names[x]||x);
    const uncertain=(f.uncertainFields||[]);
    const checkText=uncertain.length?'확인할 항목: '+uncertain.join(', '):'일부 항목 확인 필요';
    return '<div class="item"><img src="'+f.imageUrl+'" style="width:100%;height:160px;object-fit:contain;border-radius:10px;background:#090b0f;border:1px solid var(--line);margin-bottom:8px"><b>'+f.name+'</b><div class="mini" style="margin-top:4px">'+checkText+'</div><div class="opts">'+(opts.length?('인식됨: '+opts.join(' / ')):'인식 옵션 없음')+'</div><button class="btn sec" style="width:100%;margin-top:8px" data-server-manual="'+f.index+'">확인하고 등록</button></div>';
  }).join('');
  document.querySelectorAll('[data-server-manual]').forEach(b=>b.onclick=()=>{
    const f=serverFailedScans.find(x=>String(x.index)===String(b.dataset.serverManual));if(!f)return;
    manualServerFailId=f.index;setServerManualForm(f.data||{});
    $('preview').src=f.imageUrl;$('preview').style.display='block';
    const uncertain=(f.uncertainFields||[]).join(', ');
    $('ocrStatus').innerHTML='<span class="warn">확인 필요:</span> '+f.name+'<br>'+(uncertain?uncertain+'만 확인해 주세요.':'자동 인식값을 확인해 주세요.');
  });
}
async function serverApi(path,opts){const r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text());return r.json()}
function serverKey(jobId,index){return jobId+':'+index}
async function applyServerJob(job){
  let success=0;serverFailedScans=[];
  for(const r of (job.results||[])){
    if(!r)continue;
    const key=serverKey(job.id,r.index);
    if(r.complete){
      if(!inventory.some(x=>x.serverKey===key)){
        const d=r.data||{};
        const item={id:nextId++,slot:d.slot,tier:d.tier,special:d.special||'normal',equipmentName:d.equipmentName||'',opts:d.opts||[],createdAt:new Date().toISOString(),sourceName:r.name,serverKey:key};
        await saveItem(item);
      }
      success++;
    }else{
      serverFailedScans.push({index:r.index,name:r.name,imageUrl:r.imageUrl,reason:r.reason||'확인 필요',uncertainFields:r.uncertainFields||[],data:r.data||{}});
    }
  }
  renderServerFailed();
  $('ocrStatus').innerHTML='처리 완료 · <span class="good">'+success+'개 자동 등록</span> · <span class="warn">'+serverFailedScans.length+'개 확인 필요</span>';
  localStorage.removeItem(JOB_KEY);
}
async function pollServerJob(id){
  localStorage.setItem(JOB_KEY,id);ensureServerUI();
  try{
    const job=await serverApi('/api/jobs/'+id);
    const done=job.done||0,total=job.total||0;
    $('serverStatus').innerHTML='서버 OCR 작업 <b>'+done+'/'+total+'</b> · '+job.status;
    if(job.status==='completed'){await applyServerJob(job);$('serverStatus').innerHTML='<span class="good">서버 작업 완료</span> · 다른 앱으로 이동해도 서버에서 계속 처리됩니다.';return}
    if(job.status==='failed')throw new Error(job.error||'server job failed');
    setTimeout(()=>pollServerJob(id),2000);
  }catch(e){
    const msg=String(e?.message||e);
    if(msg.includes('job not found')){
      // 배포/재시작으로 사라진 예전 작업은 더 이상 재조회하지 않는다.
      if(localStorage.getItem(JOB_KEY)===id) localStorage.removeItem(JOB_KEY);
      $('serverStatus').innerHTML='<span class="warn">이전 OCR 작업 기록이 만료되었습니다.</span> · 새 이미지를 등록하면 정상 처리됩니다.';
      return;
    }
    $('serverStatus').innerHTML='<span class="bad">서버 상태 확인 실패</span> · '+msg;
    setTimeout(()=>pollServerJob(id),5000);
  }
}
$('imgInput').onchange=async e=>{
  ensureServerUI();const files=[...e.target.files];if(!files.length)return;
  // 새 작업 시작 시 과거 작업 폴링/에러 잔상을 즉시 제거한다.
  localStorage.removeItem(JOB_KEY);
  $('serverStatus').textContent='새 OCR 작업 준비 중…';
  const fd=new FormData();files.forEach(f=>fd.append('images',f));
  $('ocrStatus').textContent=files.length+'개 이미지를 서버로 업로드 중…';
  $('serverStatus').textContent='업로드가 끝나면 다른 앱으로 이동해도 됩니다.';
  try{
    const job=await serverApi('/api/jobs',{method:'POST',body:fd});
    $('ocrStatus').innerHTML='업로드 완료 · 서버 OCR 시작<br><b>이제 다른 앱으로 이동해도 됩니다.</b>';
    e.target.value='';pollServerJob(job.id);
  }catch(err){$('ocrStatus').innerHTML='<span class="bad">서버 업로드 실패</span> · '+err.message}
};
const originalRegisterHandler=$('registerBtn').onclick;
$('registerBtn').onclick=async()=>{
  const before=inventory.length;
  await originalRegisterHandler();
  if(manualServerFailId!==null&&inventory.length>before){
    serverFailedScans=serverFailedScans.filter(x=>x.index!==manualServerFailId);
    manualServerFailId=null;renderServerFailed();
  }
};
window.addEventListener('load',async()=>{
  ensureServerUI();
  try{await serverApi('/api/health');$('serverStatus').innerHTML='<span class="good">서버 연결됨</span> · 업로드 후 다른 앱으로 이동해도 OCR이 계속됩니다.'}

});

function num(id){const v=Number($(id).value);return Number.isFinite(v)?v:0}function need(target,have,per){return Math.max(0,Math.ceil(Math.max(0,target-have)/per))}
let currentNeeds={};function calc(){const role=roles[$('role').value],t=tiers[$('tier').value];$('roleDesc').textContent=`${role.desc} · 무기: ${role.weapon.map(x=>x==='colo'?'콜로':x==='world'?'월보':'대악마').join('/')}`;const b=base[$('job').value][$('weaponType').value],known=num('statGrade')+num('personality')+num('secret')+($('union').checked?5:0)+($('pet').checked?12:0)+num('rSpeed'),sf=1+(num('fury')-1)+(num('quicken')-1),req=(1-(0.25*sf/b))*100,spNeed=Math.max(0,req-known),spCount=Math.ceil(spNeed/t.a);const crit=need(50,num('rCrit'),t.a),eva=need(40,num('rEva'),t.a),dmg=$('role').value==='pvpTank'?need(100,num('rDmg'),t.b):0,leech=$('role').value!=='pvpTank'?need(50,num('rLeech'),t.b):0;currentNeeds={atkspd:spCount,crit,eva,dmgred:dmg,leech};$('speedResult').innerHTML=`필요 총 공속 보정 ${Math.max(0,req).toFixed(1)}% · 장비 제외 ${known.toFixed(1)}% · 장비 공속 <b>${spCount}개</b>`;const entries=[['공속',spCount],['치확',crit],['회피',eva]];if(dmg)entries.push(['뎀감',dmg]);if(leech)entries.push(['흡혈',leech]);$('needCards').innerHTML=entries.map(([n,c])=>`<div class="card"><div class="mini">${n}</div><div class="big">${c}개</div></div>`).join('')}
['role','tier','rCrit','rEva','rDmg','rLeech','job','weaponType','statGrade','personality','secret','rSpeed','quicken','fury','union','pet'].forEach(id=>$(id).addEventListener('input',calc));calc();
function validWeapon(it,r){return it.slot!=='weapon'||r.weapon.includes(it.special)}function optimize(){const r=roles[$('role').value];const pools={};const missing=[];slots.forEach(([s])=>{pools[s]=inventory.filter(x=>x.slot===s&&validWeapon(x,r));if(!pools[s].length)missing.push(slotNames[s])});if(missing.length){$('bestStatus').innerHTML=`<span class="bad">조합 불가:</span> ${missing.join(', ')} 후보가 없습니다.`;$('bestSet').innerHTML='';return}const supports=r.supports;let states=new Map();states.set(supports.map(()=>0).join(','),{counts:supports.map(()=>0),score:0,picks:[]});for(const [s] of slots){const next=new Map();for(const st of states.values())for(const it of pools[s]){const set=new Set(it.opts),counts=st.counts.map((v,i)=>Math.min(currentNeeds[supports[i]]||0,v+(set.has(supports[i])?1:0))),core=r.core.filter(x=>set.has(x)).length,score=st.score+core*100+({origin:1,chaos:2,abyss:3}[it.tier]||0),key=counts.join(','),cand={counts,score,picks:[...st.picks,it]},prev=next.get(key);if(!prev||cand.score>prev.score)next.set(key,cand)}states=next}let best=null,bestDef=1e9;for(const st of states.values()){const def=st.counts.reduce((a,v,i)=>a+Math.max(0,(currentNeeds[supports[i]]||0)-v),0);if(!best||def<bestDef||(def===bestDef&&st.score>best.score)){best=st;bestDef=def}}$('bestStatus').innerHTML=bestDef===0?'<span class="good">목표 조건 충족 조합</span>':'<span class="warn">가장 근접한 조합</span> · 부족 옵션 '+bestDef+'개';$('bestSet').innerHTML=best.picks.map(it=>`<div class="item"><b>${slotNames[it.slot]} · #${it.id} ${tierNames[it.tier]}</b><div class="opts">${it.opts.map(o=>names[o]).join(' / ')}</div></div>`).join('')}
$('optBtn').onclick=optimize;initDB();
})();
